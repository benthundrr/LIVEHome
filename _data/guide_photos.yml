# Inline photos and the mobile cover on guide posts.
# _includes/guides/photo-picks.html walks posts in filename order
# (date, then slug) and gives each post the pair at 2*(rank mod 14).
# The pool is exactly 28: the 26 new agency photos, then stage-event
# and creator-ringlight. team-dinner.webp and creator-dinner.webp are
# not in the rotation. Do not add the prize-cheque photo.
# pos is object-position. Portrait frames are biased toward the subject
# so a landscape object-fit: cover crop keeps faces and signs.
