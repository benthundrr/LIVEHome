{%- assign c_post = include.post -%}
<a class="g-card" href="{{ c_post.url | relative_url }}">
  {% include guides/cover.html post=c_post %}
  <span class="g-body">
    <b>{{ c_post.title }}</b>
    <span>{{ c_post.summary | default: c_post.description }}</span>
    <time datetime="{{ c_post.date | date_to_xmlschema }}">{{ c_post.date | date: '%b %-d, %Y' }}</time>
  </span>
</a>
